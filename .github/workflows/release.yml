name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

jobs:
  produce:
    name: Produce the exact release artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      KEELMATRIX_NO_TELEMETRY: '1'
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
      NUGET_XMLDOC_MODE: skip
      MSBUILDDISABLENODEREUSE: '1'

    steps:
      - name: Check out source at the triggering commit
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Restore from controlled sources and audit dependencies
        shell: pwsh
        run: dotnet restore KeelMatrix.NuGetReady.sln --configfile NuGet.config --nologo -p:NuGetAuditMode=all -p:NuGetAuditLevel=low -p:TreatWarningsAsErrors=true

      - name: Verify format
        shell: pwsh
        run: dotnet format KeelMatrix.NuGetReady.sln --verify-no-changes --no-restore --verbosity minimal

      - name: Build Release
        shell: pwsh
        run: dotnet build KeelMatrix.NuGetReady.sln --configuration Release --no-restore --nologo -p:UseSharedCompilation=false

      - name: Run release tests and validate the tag contract
        shell: pwsh
        run: dotnet test KeelMatrix.NuGetReady.sln --configuration Release --no-build --no-restore --nologo --logger "console;verbosity=minimal"

      - name: Pack the exact release artifacts
        shell: pwsh
        run: dotnet pack src/KeelMatrix.NuGetReady/KeelMatrix.NuGetReady.csproj --configuration Release --no-build --no-restore --include-symbols -p:SymbolPackageFormat=snupkg -p:ImportDirectoryBuildTargets=false -p:ImportDirectoryTargets=false --output artifacts/release --nologo -p:UseSharedCompilation=false

      - name: Upload only the exact release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: validated-release-artifacts
          path: |
            artifacts/release/KeelMatrix.NuGetReady.0.1.0.nupkg
            artifacts/release/KeelMatrix.NuGetReady.0.1.0.snupkg
          if-no-files-found: error

  validate:
    name: Validate the immutable release artifacts
    needs: produce
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      KEELMATRIX_NO_TELEMETRY: '1'
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
      NUGET_XMLDOC_MODE: skip
      MSBUILDDISABLENODEREUSE: '1'
      NUGET_PACKAGES: /tmp/nugetready-packages

    steps:
      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.425'

      - name: Download the immutable release artifacts
        uses: actions/download-artifact@v4
        with:
          name: validated-release-artifacts
          path: /tmp/nugetready-artifacts

      - name: Configure source-exclusive candidate acquisition
        shell: pwsh
        run: |
          @'
          <?xml version="1.0" encoding="utf-8"?>
          <configuration>
            <packageSources>
              <clear />
              <add key="candidate" value="/tmp/nugetready-artifacts" />
              <add key="nuget.org" value="https://api.nuget.org/v3/index.json" protocolVersion="3" />
            </packageSources>
            <packageSourceMapping>
              <clear />
              <packageSource key="candidate">
                <package pattern="KeelMatrix.NuGetReady" />
              </packageSource>
              <packageSource key="nuget.org">
                <package pattern="*" />
              </packageSource>
            </packageSourceMapping>
          </configuration>
          '@ | Set-Content -LiteralPath /tmp/nugetready-tool.config -Encoding utf8NoBOM

      - name: Install the candidate NuGetReady tool from its exclusive source mapping
        shell: pwsh
        run: dotnet tool install KeelMatrix.NuGetReady --version 0.1.0 --tool-path /tmp/nugetready-tool --configfile /tmp/nugetready-tool.config --no-cache --verbosity minimal

      - name: Check out source at the triggering commit
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Validate the exact package set with NuGetReady
        shell: pwsh
        run: /tmp/nugetready-tool/nugetready check --config nugetready.json --artifacts /tmp/nugetready-artifacts --format json

  publish:
    name: Publish the exact validated package
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    env:
      KEELMATRIX_NO_TELEMETRY: '1'
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
      NUGET_XMLDOC_MODE: skip
      MSBUILDDISABLENODEREUSE: '1'

    steps:
      - name: Download the validated release artifacts
        uses: actions/download-artifact@v4
        with:
          name: validated-release-artifacts
          path: artifacts/release

      - name: Authenticate to NuGet.org with Trusted Publishing
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: dmitriyzen

      - name: Publish the exact validated package
        shell: pwsh
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: dotnet nuget push artifacts/release/KeelMatrix.NuGetReady.0.1.0.nupkg --source https://api.nuget.org/v3/index.json --api-key "$env:NUGET_API_KEY"
