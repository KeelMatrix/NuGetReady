name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

jobs:
  validate:
    name: Validate the exact release artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      KEELMATRIX_NO_TELEMETRY: '1'
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
      NUGET_XMLDOC_MODE: skip
      MSBUILDDISABLENODEREUSE: '1'

    steps:
      - name: Check out source at the triggering tag
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.ref }}

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Restore from controlled sources and audit dependencies
        shell: pwsh
        run: |
          dotnet restore KeelMatrix.NuGetReady.sln --configfile NuGet.config --nologo -p:NuGetAuditMode=all -p:NuGetAuditLevel=low -p:TreatWarningsAsErrors=true
          if ($LASTEXITCODE -ne 0) { throw "Dependency restore or NuGet audit failed." }

      - name: Validate the tag and repository release contract
        shell: pwsh
        run: |
          pwsh -NoProfile -NonInteractive -File scripts/validate-release-contract.ps1 -RepositoryRoot $env:GITHUB_WORKSPACE -Mode Tag -ExpectedVersion 0.1.0 -TagVersion $env:GITHUB_REF_NAME
          if ($LASTEXITCODE -ne 0) { throw "Release contract validation failed." }

      - name: Verify format
        shell: pwsh
        run: |
          dotnet format KeelMatrix.NuGetReady.sln --verify-no-changes --no-restore --verbosity minimal
          if ($LASTEXITCODE -ne 0) { throw "Formatting verification failed." }

      - name: Build Release
        shell: pwsh
        run: |
          dotnet build KeelMatrix.NuGetReady.sln --configuration Release --no-restore --nologo -p:UseSharedCompilation=false
          if ($LASTEXITCODE -ne 0) { throw "Release build failed." }

      - name: Run release tests
        shell: pwsh
        run: |
          dotnet test KeelMatrix.NuGetReady.sln --configuration Release --no-build --no-restore --nologo --logger "console;verbosity=minimal"
          if ($LASTEXITCODE -ne 0) { throw "Release tests failed." }

      - name: Pack the exact release artifacts
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $output = Join-Path $env:GITHUB_WORKSPACE 'artifacts/release'
          if (Test-Path -LiteralPath $output) { Remove-Item -LiteralPath $output -Recurse -Force }
          New-Item -ItemType Directory -Path $output -Force | Out-Null
          dotnet pack src/KeelMatrix.NuGetReady/KeelMatrix.NuGetReady.csproj --configuration Release --no-build --no-restore --include-symbols -p:SymbolPackageFormat=snupkg -p:ImportDirectoryBuildTargets=false -p:ImportDirectoryTargets=false --output $output --nologo -p:UseSharedCompilation=false
          if ($LASTEXITCODE -ne 0) { throw "Release package creation failed." }

          $expected = @(
            'KeelMatrix.NuGetReady.0.1.0.nupkg',
            'KeelMatrix.NuGetReady.0.1.0.snupkg'
          )
          $actual = @(Get-ChildItem -LiteralPath $output -File | ForEach-Object { $_.Name })
          $difference = Compare-Object ($expected | Sort-Object) ($actual | Sort-Object)
          if ($null -ne $difference) {
            throw "Release output is not the exact expected artifact set. Expected: $($expected -join ', '). Actual: $($actual -join ', ')."
          }

      - name: Inspect the exact package archives
        shell: pwsh
        run: |
          pwsh -NoProfile -File scripts/inspect-package.ps1 -PackagePath artifacts/release/KeelMatrix.NuGetReady.0.1.0.nupkg -SymbolsPackagePath artifacts/release/KeelMatrix.NuGetReady.0.1.0.snupkg -ExpectedVersion 0.1.0
          if ($LASTEXITCODE -ne 0) { throw "Package archive inspection failed." }

      - name: Validate the exact package set with NuGetReady
        shell: pwsh
        run: dotnet run --project src/KeelMatrix.NuGetReady/KeelMatrix.NuGetReady.csproj --configuration Release --no-build --no-restore -- check --config nugetready.json --artifacts artifacts/release --format json

      - name: Upload only the validated release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: validated-release-artifacts
          path: |
            artifacts/release/KeelMatrix.NuGetReady.0.1.0.nupkg
            artifacts/release/KeelMatrix.NuGetReady.0.1.0.snupkg
          if-no-files-found: error

  publish:
    name: Publish the exact validated package
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    env:
      KEELMATRIX_NO_TELEMETRY: '1'
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
      NUGET_XMLDOC_MODE: skip
      MSBUILDDISABLENODEREUSE: '1'

    steps:
      - name: Download the validated release artifacts
        uses: actions/download-artifact@v4
        with:
          name: validated-release-artifacts
          path: artifacts/release

      - name: Authenticate to NuGet.org with Trusted Publishing
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: dmitriyzen

      - name: Publish the exact validated package
        shell: pwsh
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: dotnet nuget push artifacts/release/KeelMatrix.NuGetReady.0.1.0.nupkg --source https://api.nuget.org/v3/index.json --api-key "$env:NUGET_API_KEY"
