name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

jobs:
  validate:
    name: Validate the exact release artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      KEELMATRIX_NO_TELEMETRY: '1'
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
      NUGET_XMLDOC_MODE: skip
      MSBUILDDISABLENODEREUSE: '1'

    steps:
      - name: Check out source at the triggering tag
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.ref }}
          persist-credentials: false

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Restore from controlled sources and audit dependencies
        shell: pwsh
        run: dotnet restore KeelMatrix.NuGetReady.sln --configfile NuGet.config --nologo -p:NuGetAuditMode=all -p:NuGetAuditLevel=low -p:TreatWarningsAsErrors=true

      - name: Verify format
        shell: pwsh
        run: dotnet format KeelMatrix.NuGetReady.sln --verify-no-changes --no-restore --verbosity minimal

      - name: Build Release
        shell: pwsh
        run: dotnet build KeelMatrix.NuGetReady.sln --configuration Release --no-restore --nologo -p:UseSharedCompilation=false

      - name: Run release tests and validate the tag contract
        shell: pwsh
        run: dotnet test KeelMatrix.NuGetReady.sln --configuration Release --no-build --no-restore --nologo --logger "console;verbosity=minimal"

      - name: Pack the exact release artifacts
        shell: pwsh
        run: dotnet pack src/KeelMatrix.NuGetReady/KeelMatrix.NuGetReady.csproj --configuration Release --no-build --no-restore --include-symbols -p:SymbolPackageFormat=snupkg -p:ImportDirectoryBuildTargets=false -p:ImportDirectoryTargets=false --output artifacts/release --nologo -p:UseSharedCompilation=false

      - name: Install the pinned NuGetReady tool
        shell: pwsh
        run: dotnet tool install KeelMatrix.NuGetReady --version 0.1.0 --tool-path .nugetready --configfile NuGet.config --add-source artifacts/release --no-cache --verbosity minimal

      - name: Validate the exact package set with NuGetReady
        shell: pwsh
        run: ./.nugetready/nugetready check --config nugetready.json --artifacts artifacts/release --format json

      - name: Upload only the validated release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: validated-release-artifacts
          path: |
            artifacts/release/KeelMatrix.NuGetReady.0.1.0.nupkg
            artifacts/release/KeelMatrix.NuGetReady.0.1.0.snupkg
          if-no-files-found: error

  publish:
    name: Publish the exact validated package
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    env:
      KEELMATRIX_NO_TELEMETRY: '1'
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
      NUGET_XMLDOC_MODE: skip
      MSBUILDDISABLENODEREUSE: '1'

    steps:
      - name: Download the validated release artifacts
        uses: actions/download-artifact@v4
        with:
          name: validated-release-artifacts
          path: artifacts/release

      - name: Authenticate to NuGet.org with Trusted Publishing
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: dmitriyzen

      - name: Publish the exact validated package
        shell: pwsh
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: dotnet nuget push artifacts/release/KeelMatrix.NuGetReady.0.1.0.nupkg --source https://api.nuget.org/v3/index.json --api-key "$env:NUGET_API_KEY"
